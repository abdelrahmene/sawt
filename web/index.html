<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sawt</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#111116; --line:#1e1e26; --ink:#e9e9ee; --dim:#8a8a97;
    --accent:#36d399; --warn:#f0b429; --bad:#f06a6a; --radius:14px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;grid-template-columns:minmax(380px,460px) 1fr;
  }
  @media (max-width:900px){ body{grid-template-columns:1fr;grid-template-rows:1fr auto} }

  /* ── left: the conversation ─────────────────────────────────────────── */
  #chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--panel)}
  header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  header h1{margin:0;font-size:17px;letter-spacing:.02em}
  header .ar{color:var(--dim);font-size:15px}
  header .mode{margin-inline-start:auto;font:11px var(--mono);color:var(--warn);
    border:1px solid var(--warn);padding:2px 8px;border-radius:99px;opacity:.85}

  #log{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
  .msg{max-width:92%;padding:10px 13px;border-radius:var(--radius);white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:#1d2a24;border:1px solid #27402f}
  .msg.bot{align-self:flex-start;background:#15151b;border:1px solid var(--line)}
  .msg.ask{align-self:flex-start;background:#2a2314;border:1px solid #4a3c1a}
  .msg.ask::before{content:"question";display:block;font:10px var(--mono);
    letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:5px}
  .msg[dir=rtl]{text-align:right}
  .msg .tr{display:block;margin-top:6px;color:var(--dim);font-size:13px;font-style:italic}

  /* the two readings of one voice note — the heart of the project */
  .heard{align-self:stretch;border:1px solid var(--line);border-radius:var(--radius);
    background:#0e0e13;padding:11px 13px;font-size:13px}
  .heard b{display:block;font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin-bottom:7px}
  .heard .row{display:flex;gap:9px;align-items:flex-start;margin-bottom:5px}
  .heard .tag{flex:0 0 auto;font:10px var(--mono);padding:1px 6px;border-radius:4px;margin-top:3px}
  .heard .tag.a{background:#2a1f1f;color:var(--bad)}
  .heard .tag.p{background:#172a22;color:var(--accent)}
  .heard .txt{flex:1;direction:rtl;text-align:right}
  .heard .gap{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    color:var(--warn);font-size:12px}

  #dock{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:9px;align-items:center}
  #text{flex:1;background:#0c0c11;border:1px solid var(--line);border-radius:11px;
    color:var(--ink);padding:10px 12px;font:inherit;outline:none}
  #text:focus{border-color:#2c3a33}
  .btn{background:#17171e;border:1px solid var(--line);color:var(--ink);border-radius:11px;
    padding:10px 13px;cursor:pointer;font:inherit;display:grid;place-items:center}
  .btn:hover{border-color:#2f2f3c}
  .btn.rec{background:var(--accent);border-color:var(--accent);color:#06130d;font-weight:650}
  .btn.rec.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  /* ── right: what the agent made ─────────────────────────────────────── */
  #canvas{overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-height:0}
  #canvas .empty{margin:auto;max-width:430px;color:var(--dim);text-align:center;line-height:1.7}
  #canvas .empty kbd{font:12px var(--mono);background:#15151b;border:1px solid var(--line);
    border-radius:5px;padding:2px 6px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card > h3{margin:0;padding:11px 15px;font-size:13px;font-weight:600;letter-spacing:.02em;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .card .body{padding:14px 15px}
  .badge{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:2px 7px;border-radius:99px;margin-inline-start:auto}
  .badge.real{background:#152a20;color:var(--accent);border:1px solid #1f4433}
  .badge.sim{background:#2a2314;color:var(--warn);border:1px solid #4a3c1a}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:11px}
  .grid figure{margin:0}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
  .grid figcaption{font-size:12px;color:var(--dim);margin-top:6px}

  iframe{width:100%;height:440px;border:0;background:#fff;display:block}

  table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  td.num{text-align:right}
  tr.best td{color:var(--accent)}
  tr.worst td{color:var(--bad)}

  pre{margin:0;font:12px var(--mono);color:#b9c4bf;white-space:pre-wrap;word-break:break-word}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0}
  .why{margin-top:11px;padding:9px 11px;background:#0e0e13;border-inline-start:2px solid var(--accent);
    border-radius:0 8px 8px 0;font-size:13px}
  .why b{color:var(--accent);font-weight:600}
  a{color:var(--accent)}
  .step{font:11px var(--mono);color:var(--dim);display:flex;align-items:center;gap:8px}
  .step .dot{width:6px;height:6px;border-radius:99px;background:var(--dim)}
  .step.live .dot{background:var(--accent);animation:pulse 1s infinite}
</style>
</head>
<body>
  <section id="chat">
    <header>
      <h1>Sawt</h1><span class="ar">صوت</span>
      <span class="mode" id="mode">prototype</span>
    </header>
    <div id="log"></div>
    <div id="dock">
      <button class="btn" id="photo" title="Ajouter une photo produit">🖼</button>
      <input id="text" placeholder="Écris, ou tiens le micro et parle en darija…" autocomplete="off">
      <button class="btn rec" id="mic" title="Maintenir pour parler">🎤</button>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </section>

  <section id="canvas">
    <div class="empty">
      <p><strong>Donne-lui une photo de produit, puis parle-lui.</strong></p>
      <p>« دير لي إشهار على هاد الصباط و لانسيه بـ 2000 دينار في النهار »</p>
      <p>Tiens <kbd>🎤</kbd> enfoncé pendant que tu parles.</p>
    </div>
  </section>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
