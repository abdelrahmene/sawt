<!doctype html>
<html lang="en" dir="ltr" data-shell="phone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Sawt</title>
<!-- Le thème et la coque AVANT la feuille de style, sinon l'écran part en
     blanc puis bascule, et le téléphone apparaît après coup en sautant.
     Clair par défaut, téléphone par défaut. -->
<!-- Le thème est posé AVANT le premier rendu, sinon la page clignote en clair
     une fraction de seconde avant de passer en nuit. Ordre : ce que la
     personne a choisi, sinon ce que son système demande, sinon la nuit — qui
     est le thème pour lequel cette app a été dessinée, et que app.css décrit
     comme tel depuis le début alors que ce script ouvrait en clair. -->
<script>try{var r=document.documentElement,s=localStorage,v=s.getItem('sawt.theme');
if(!v){v=matchMedia('(prefers-color-scheme: light)').matches?'jour':'nuit'}
r.dataset.theme=v;r.dataset.shell=s.getItem('sawt.shell')||'phone';
var l=s.getItem('sawt.lang')||'en';r.lang=l;r.dir=l==='ar'?'rtl':'ltr'}catch(e){}</script>
<link rel="stylesheet" href="/web/app.css">
<link rel="stylesheet" href="/web/journal.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230d7a5f'/><circle cx='12' cy='12' r='5' fill='%2338e0ad'/></svg>">
</head>
<body>

<!-- Le plan de travail. En coque téléphone il entoure l'appareil ; en coque
     bureau il ne se voit pas. -->
<div id="stage">

  <div id="device">

    <!-- La barre du haut, commune aux deux coques : qui on est, dans quelle
         langue, dans quel thème, et surtout QUEL MODÈLE vient de répondre —
         ça, ça ne doit jamais quitter l'écran pendant une démonstration. -->
    <header id="appbar">
      <span class="orb" title="Sawt"></span>
      <strong class="wordmark">Sawt</strong><span class="ar">صوت</span>
      <div class="sp"></div>
      <span class="mode brain" id="brain" data-i18n-title="shell.brain"></span>
      <!-- Le solde, toujours à l'écran. Un marchand qui lance quatre images
           sans voir ce qu'il lui reste n'a pas de prise sur sa dépense.
           Le portefeuille est une mise en scène et le dit (title + Réglages) ;
           le NOMBRE D'APPELS derrière, lui, est compté pour de vrai. -->
      <span class="mode credits" id="credits" data-i18n-title="shell.credits"></span>
      <span class="mode" id="mode">…</span>
      <!-- La cloche. Une pastille dit « il y a 3 choses » et jamais
           lesquelles — on apprend a l'ignorer. Celle-ci s'ouvre et raconte. -->
      <button class="icon sm themer bell" id="bell" data-i18n-title="shell.notifs"></button>
      <button class="chip lang" id="lang" data-i18n-title="shell.langTitle"></button>
      <!-- La bascule téléphone / bureau vit DANS la barre du haut.
           Elle flottait avant hors de l'appareil, en haut à droite de la
           fenêtre, dessinée en blanc sur fond blanc : elle existait, elle
           marchait, et personne ne la voyait. -->
      <button class="icon sm themer" id="shelltog"></button>
      <button class="icon sm themer" id="theme"></button>
      <button class="icon sm" id="reset" data-i18n-title="shell.newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </header>

    <!-- Le menu. Colonne à gauche sur un bureau, barre du bas sur un
         téléphone — ce sont les mêmes boutons, c'est la grille qui change. -->
    <aside id="rail">
      <nav id="tabs"></nav>
    </aside>

    <main>
      <!-- ══ the agent ══════════════════════════════════════════════════ -->
      <section class="view on" id="v-chat">
        <div id="chat">
          <div id="log"></div>
          <div id="dock">
            <div class="wrap">
              <!-- Le niveau du micro, dessiné en direct. C'est la signature de
                   l'app : elle s'appelle « la voix », il faut la voir. -->
              <canvas id="wave" width="760" height="56" aria-hidden="true"></canvas>
              <button class="icon" id="photo" data-i18n-title="shell.addPhoto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M3 16.5l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
              </button>
              <textarea id="text" rows="1" data-i18n-ph="shell.composer" autocomplete="off"></textarea>
              <button class="icon rec" id="mic" data-i18n-title="shell.holdMic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/></svg>
              </button>
            </div>
            <div class="hint" data-i18n="shell.hint"></div>
          </div>
          <input type="file" id="file" accept="image/*" multiple hidden>
        </div>

        <div id="canvas">
          <div class="empty" id="canvas-empty">
            <div class="big">◍</div>
            <h3 data-i18n="shell.empty.title"></h3>
            <p data-i18n="shell.empty.body"></p>
            <div class="say-ar">دير لي إشهار على هاد الصباط<br>و لانسيه بـ 2000 دينار في النهار</div>
            <p class="tip" data-i18n="shell.empty.tip"></p>
          </div>
          <button id="tolatest" data-i18n="shell.toLatest"></button>
        </div>
      </section>

      <!-- ══ the rest, each rendered by its own module ══════════════════ -->
      <section class="view scroll" id="v-catalog"></section>
      <section class="view" id="v-studio"></section>
      <section class="view scroll" id="v-sites"></section>
      <section class="view scroll" id="v-campaigns"></section>
      <section class="view scroll" id="v-journal"></section>
      <section class="view" id="v-inbox"></section>
      <section class="view scroll" id="v-meta"></section>
      <section class="view scroll" id="v-settings"></section>
    </main>

    <!-- Dedans, pas dehors. Ces trois-là sont en `position:fixed` : posés
         dans <body>, ils se calaient sur la FENÊTRE — un toast centré au
         milieu de l'écran de bureau pendant que l'app tient dans un
         téléphone de 412 px, et une visionneuse qui noircissait les 1920 px.
         `#device` porte maintenant `container-type`, ce qui en fait le bloc
         conteneur des descendants fixes : ils restent dans l'appareil.
         Ils sont hors flux, donc ils ne prennent aucune case de la grille. -->
    <div id="lightbox"><img alt=""><span class="hint" data-i18n="shell.lightbox"></span></div>
    <div class="toast" id="toast"></div>
    <div id="notifs" hidden></div>

  </div>

</div>

<script type="module" src="/web/app.js"></script>
</body>
</html>
